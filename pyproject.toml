[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-network-intrusion-detection"
version = "0.1.0"
description = "Reproducible, offline machine-learning research for network intrusion detection"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "Project contributors"}]
dependencies = [
    "numpy>=1.26,<3",
    "pandas>=2.2,<3",
    "scikit-learn>=1.5,<2",
    "matplotlib>=3.8,<4",
    "streamlit>=1.37,<2",
    "joblib>=1.4,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
nids = "nids.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
