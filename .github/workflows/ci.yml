name: Python quality gates

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: python-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements-dev.txt
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Validate installed dependencies
        run: python -m pip check
      - name: Reject accidentally tracked datasets and secrets
        run: python scripts/check_repo_hygiene.py --root .
      - name: Compile source and tests
        run: python -m compileall -q src app tests scripts
      - name: Check status command
        run: python -m nids.cli status
      - name: Unit and integration tests with minimum coverage
        run: python -m pytest -q --cov=nids --cov=app --cov-report=term-missing:skip-covered --cov-fail-under=90
